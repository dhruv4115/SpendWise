name: spendwise
description: "SpendWise — a personal spend tracker for a retail banking customer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State: Riverpod 2.x, no codegen and no build_runner anywhere in this project.
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^18.0.1

  # Networking
  dio: ^5.11.1

  # Charts
  fl_chart: ^1.2.0

  # Device capabilities
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  flutter_local_notifications: ^22.3.1
  share_plus: ^13.3.0
  path_provider: ^2.1.6

  # Formatting
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
